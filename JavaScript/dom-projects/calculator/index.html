<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
  </head>
  <body
    class="bg-gray-900 min-h-screen text-white flex flex-col justify-center items-center gap-5"
  >
    <form action="">
      <input type="number" name="" id="" placeholder="Enter first number: " />
      <input type="number" name="" id="" placeholder="Enter second number: " />
      <button
        type="submit"
        class="bg-green-700 px-7 py-2 rounded hover:bg-green-600 active:bg-green-800"
      >
        Add
      </button>
      <button
        type="submit"
        class="bg-red-500 px-7 py-2 rounded hover:bg-red-600 active:bg-red-800"
      >
        Subtract
      </button>
      <button
        type="submit"
        class="bg-blue-500 px-7 py-2 rounded hover:bg-blue-600 active:bg-blue-800"
      >
        Multiply
      </button>
      <button
        type="submit"
        class="bg-yellow-500 px-7 py-2 rounded hover:bg-yellow-600 active:bg-yellow-800"
      >
        Divide
      </button>
    </form>
    <script src="index.js" type="module"></script>
  </body>
</html>
