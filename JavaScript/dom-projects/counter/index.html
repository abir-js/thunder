<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>counter</title>
  </head>
  <body>
    <div
      id="app"
      class="min-h-screen flex flex-col justify-center items-center gap-4 text-center bg-neutral-900"
    >
      <div id="counter" class="text-4xl font-bold text-white">0</div>

      <button
        id="increment"
        class="bg-green-700 px-7 py-2 rounded hover:bg-green-600 active:bg-green-800"
      >
        +1
      </button>
      <button
        id="decrement"
        class="bg-red-500 px-7 py-2 rounded hover:bg-red-600 active:bg-red-800"
      >
        -1
      </button>
    </div>
    <script type="module" src="index.js"></script>
  </body>
</html>
